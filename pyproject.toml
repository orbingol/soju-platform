[build-system]
requires = ["setuptools>=80", "setuptools-scm>=10"]
build-backend = "setuptools.build_meta"

[project]
name = "soju"
description = "Soju (소주) Platform Development Tools"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
  { name = "Onur R. Bingol" },
]
keywords = ["korean", "language-learning", "vocabulary", "education"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Education",
]
dependencies = [
  "check-jsonschema>=0.37.0",
  "edge-tts>=7.2.3",
  "fastapi>=0.115.12",
  "httpx>=0.28.0",
  "poethepoet>=0.48.0",
  "pydantic>=2.10.0",
  "pyyaml>=6.0.3",
  "typer>=0.27.0",
  "uvicorn[standard]>=0.34.2",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/orbingol/soju-platform"
Repository = "https://github.com/orbingol/soju-platform"
Issues = "https://github.com/orbingol/soju-platform/issues"

[project.scripts]
soju = "soju.cli.app:main"

[dependency-groups]
docs = [
  "sphinx>=9.1",
  "furo>=2025.12.19",
  "sphinx-autobuild>=2025.8.25",
  "sphinx-copybutton>=0.5.2",
  "sphinxcontrib-typer>=0.9.1",
]
dev = [
  "pre-commit>=4.6.0",
  "pytest>=9.1.0",
  "pytest-cov>=7.1.0",
  "python-dotenv>=1.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"soju.backend.config.files" = ["*.yaml"]

[tool.setuptools_scm]
write_to = "src/soju/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.uv]
default-groups = ["docs", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "system: end-to-end CLI / data-pipeline tests on a temp data tree",
  "llm: requires a reachable Ollama (skipped unless --llm or SOJU_RUN_LLM_TESTS=1)",
]

[tool.coverage.run]
source = ["soju"]
branch = false
omit = ["src/soju/_version.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.doc8]
max-line-length = 180

[tool.ruff]
line-length = 180

[tool.poe.tasks.validate-schemas]
help = "JSON Schema check over data files."
cmd = "soju validate-schemas"

[tool.poe.tasks.validate-align]
help = "Check verb forms ↔ registry alignment."
cmd = "soju align"

[tool.poe.tasks.validate-registry]
help = "Check UUID / refs / sense uniqueness and unknown vocabulary or grammar level ids."
cmd = "soju registry"

[tool.poe.tasks.validate]
help = "Run JSON Schema checks, alignment, and registry validation."
sequence = [
  "validate-schemas",
  "validate-align",
  "validate-registry",
]

[tool.poe.tasks.import-words]
help = "Import words from a text file into a topic (existing words: merge examples only)."
cmd = "soju import words --topic ${topic} --file ${file}"
args = [{ name = "topic", default = "family" }, { name = "file", options = ["-f", "--file"], required = true }]

[tool.poe.tasks.translate-words]
help = "Translate a plain-text word list to JSON via Ollama (pipe to soju import)."
cmd = "soju translate-words --file ${file}"
args = [{ name = "file", options = ["-f", "--file"], required = true }]

[tool.poe.tasks.import-verbs]
help = "Import verbs from JSON on stdin (AI-assisted workflow)."
cmd = "soju import verbs --stdin-json"

[tool.poe.tasks.embed-index]
help = "Build the Ollama embedding cache for Practice retrieval (data/cache/embeddings/)."
cmd = "soju embed-index"

[tool.poe.tasks.setup-ollama]
help = "Pull default Ollama chat + embed models (gemma4:e4b, nomic-embed-text)."
sequence = [
  { cmd = "ollama pull gemma4:e4b" },
  { cmd = "ollama pull nomic-embed-text" },
]

[tool.poe.tasks.container-up-dev]
help = "Start Soju in dev mode: Vite :14321, API :14322, docs :14323 (no nginx)."
cmd = "docker compose -f docker-compose.yml -f docker-compose.dev.yml up ${detach:+--detach}"
args = [{ name = "detach", options = ["-d", "--detach"], type = "boolean", default = false, help = "Run containers in the background." }]

[tool.poe.tasks.up]
help = "Alias for container-up-dev."
ref = "container-up-dev"

[tool.poe.tasks.container-up-prod]
help = "Start Soju in prod mode: nginx :8080 only (UI /, API /api, docs /docs)."
cmd = "docker compose up ${detach:+--detach}"
args = [{ name = "detach", options = ["-d", "--detach"], type = "boolean", default = false, help = "Run containers in the background." }]

[tool.poe.tasks.up-prod]
help = "Alias for container-up-prod."
ref = "container-up-prod"

[tool.poe.tasks.container-down]
help = "Stop and remove Soju Compose containers (after container-up-dev or container-up-prod)."
cmd = "docker compose -f docker-compose.yml -f docker-compose.dev.yml down ${volumes:+--volumes}"
args = [{ name = "volumes", options = ["-v", "--volumes"], type = "boolean", default = false, help = "Also remove named volumes (e.g. docs_build, node_modules)." }]

[tool.poe.tasks.container-build]
help = "Rebuild all Compose images (web, backend, docs, nginx) and exit."
cmd = "docker compose -f docker-compose.yml -f docker-compose.dev.yml build"

[tool.poe.tasks.build]
help = "Alias for container-build."
ref = "container-build"

[tool.poe.tasks.container-cli]
help = "Run soju CLI in the backend image (pass any soju args; e.g. poe container-cli validate-schemas)."
cmd = "docker compose run --rm --no-deps backend soju"

[tool.poe.tasks.soju]
help = "Alias for container-cli."
ref = "container-cli"

[tool.poe.tasks.pre-commit]
help = "Run pre-commit hooks on all files."
cmd = "pre-commit run --all-files"

[tool.poe.tasks.lint]
help = "Alias for pre-commit (run hooks on all files)."
ref = "pre-commit"

[tool.poe.tasks.test]
help = "Run Python unit + offline system tests (skips @pytest.mark.llm)."
cmd = "pytest -m \"not llm\""

[tool.poe.tasks.test-unit]
help = "Run Python unit tests only (exclude system and llm)."
cmd = "pytest -m \"not system and not llm\""

[tool.poe.tasks.test-system]
help = "Run offline system tests (CLI pipelines on temp data; skips llm)."
cmd = "pytest -m \"system and not llm\""

[tool.poe.tasks.test-llm]
help = "Run optional LLM system tests (needs Ollama; pass --llm)."
cmd = "pytest -m llm --llm"

[tool.poe.tasks.test-all]
help = "Run unit, offline system, and LLM tests (needs Ollama for @pytest.mark.llm)."
cmd = "pytest --llm"

[tool.poe.tasks.coverage]
help = "Run unit + offline system tests with line coverage for soju."
cmd = "pytest -m \"not llm\" --cov=soju --cov-report=term-missing"

[tool.poe.tasks.docs]
help = "Build Sphinx HTML user guide into docs/_build/html."
cmd = "make clean html"
cwd = "docs"

[tool.poe.tasks.docs-serve]
help = "Build and serve Sphinx docs with live reload on the host (default :14323; Compose serves /docs via nginx :8080)."
cmd = "make clean html serve PORT=${port}"
cwd = "docs"
args = [{ name = "port", default = "14323", options = ["--port"] }]
