[build-system]
requires = ["setuptools>=80", "setuptools-scm>=10"]
build-backend = "setuptools.build_meta"

[project]
name = "soju"
description = "Soju (소주) Platform Development Tools"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
  { name = "Onur R. Bingol" },
]
keywords = ["korean", "language-learning", "vocabulary", "education"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Education",
]
dependencies = [
  "check-jsonschema>=0.37.0",
  "edge-tts>=7.2.3",
  "fastapi>=0.115.12",
  "httpx>=0.28.0",
  "poethepoet>=0.48.0",
  "pydantic>=2.10.0",
  "pyyaml>=6.0.3",
  "typer>=0.27.0",
  "uvicorn[standard]>=0.34.2",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/orbingol/soju-platform"
Repository = "https://github.com/orbingol/soju-platform"
Issues = "https://github.com/orbingol/soju-platform/issues"

[project.scripts]
soju = "soju.cli.app:main"

[dependency-groups]
docs = [
  "sphinx>=9.1",
  "furo>=2025.12.19",
  "sphinx-autobuild>=2025.8.25",
  "sphinx-copybutton>=0.5.2",
  "sphinxcontrib-typer>=0.9.1",
]
dev = [
  "pre-commit>=4.6.0",
  "pytest>=9.1.0",
  "pytest-cov>=7.1.0",
  "python-dotenv>=1.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"soju.backend.config.files" = ["*.yaml"]

[tool.setuptools_scm]
write_to = "src/soju/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.uv]
default-groups = ["docs", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "system: end-to-end CLI / data-pipeline tests on a temp data tree",
  "llm: requires a reachable Ollama (skipped unless --llm or SOJU_RUN_LLM_TESTS=1)",
]

[tool.coverage.run]
source = ["soju"]
branch = false
omit = ["src/soju/_version.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.doc8]
max-line-length = 180

[tool.ruff]
line-length = 180

[tool.poe]
include = ".poe_tasks.toml"
