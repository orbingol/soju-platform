# Only nginx is published on the host (:8080).
#   /       → web (Vite / SvelteKit)
#   /api/   → backend (FastAPI; prefix stripped)
#   /docs/  → docs (Sphinx)
# Internal services stay on the Compose network (see docker-compose.yml).

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream soju_web {
    server web:14321;
}

upstream soju_backend {
    server backend:14322;
}

upstream soju_docs {
    server docs:14323;
}

server {
    listen 80;
    server_name _;

    # Keep any Location redirects relative so the browser keeps host:8080
    # (nginx listens on :80 inside the container; absolute redirects drop the published port).
    absolute_redirect off;

    client_max_body_size 16m;

    # Browser → http://localhost:8080/api/v1/... → backend /v1/...
    location /api/ {
        proxy_pass http://soju_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Internal rewrite — no client 301 (avoids absolute redirect to :80 / https).
    location = /api {
        rewrite ^ /api/ last;
    }

    # Browser → http://localhost:8080/docs/ → Sphinx HTML
    location /docs/ {
        proxy_pass http://soju_docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
    }

    # Client redirect so the browser URL ends with /docs/ — Sphinx uses relative
    # ``_static/…`` links, which break when the address bar is ``/docs`` (no slash).
    location = /docs {
        return 301 /docs/;
    }

    # Vite / SvelteKit UI (WebSocket for HMR)
    location / {
        proxy_pass http://soju_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
    }
}
