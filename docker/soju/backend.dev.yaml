# Compose override for the backend in ``poe up`` (direct host ports, no nginx).
# Mounted as /config/soju/backend.dev.yaml.
# Deep-merged over packaged soju.backend.config.files.default_config.yaml.

server:
  root_path: ""
  cors_origins:
    - "http://localhost:14321"

llm:
  # Reach host (or compose-profile) Ollama from the backend container.
  base_url: "http://host.docker.internal:11434"
  # Optional: override packaged default (gemma4:e4b). UI picks this up via
  # GET /v1/soju/config/client. For macOS MLX on host Ollama, uncomment:
  # chat_model: "gemma4:e4b-mlx"
