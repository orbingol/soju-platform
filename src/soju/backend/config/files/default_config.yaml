# Shipped defaults for the Soju FastAPI backend (soju.backend.config.files).
# Override with --config PATH, or place a file at ~/.config/soju/backend.yaml.

server:
  host: "0.0.0.0"
  port: 14322
  cors_origins:
    - "http://localhost:8080"
    - "http://localhost:14321"
  root_path: ""

llm:
  provider: ollama
  # Host Ollama when running `soju backend` on the machine (Compose overrides this).
  base_url: "http://localhost:11434"
  chat_model: "gemma4:e4b"
  embed_model: "nomic-embed-text"
  timeout_s: 600

tts:
  engine: edge
  voice: "ko-KR-SunHiNeural"
  piper:
    model_path: null
    speaker: null

client:
  ai_enabled: true
  api_mode: chat-completions
  tutor_name: "Hee-jae (희재)"
  # Optional override; empty → prompts.chat.system from prompts.yaml
  system_prompt: ""
  chat_summary_trigger: 10
  chat_keep_recent: 6
