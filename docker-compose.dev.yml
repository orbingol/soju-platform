# Dev override: publish Vite / FastAPI / docs on the host; skip nginx.
#
#   uv run poe up
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# UI http://localhost:14321  ·  API http://localhost:14322  ·  Docs http://localhost:14323

services:
  nginx:
    # Keep the service defined but out of the default project start set.
    profiles: ["nginx"]

  web:
    ports:
      - "14321:14321"
    environment:
      PUBLIC_AI_BASE_URL: http://localhost:14322
      VITE_HMR_CLIENT_PORT: "14321"

  backend:
    ports:
      - "14322:14322"
    command:
      [
        "soju",
        "backend",
        "--config",
        "/config/soju/backend.dev.yaml",
        "--host",
        "0.0.0.0",
        "--port",
        "14322",
      ]

  docs:
    build:
      target: dev
    command:
      [
        "sphinx-autobuild",
        "soju",
        "/app/docs-build/html",
        "-c",
        ".",
        "--host",
        "0.0.0.0",
        "--port",
        "14323",
      ]
    working_dir: /app/docs
    ports:
      - "14323:14323"
    volumes:
      - ./docs:/app/docs:rw
      # Build output outside the docs bind mount so Docker never creates a
      # root-owned docs/_build/ mountpoint on the host (breaks ``poe docs`` clean).
      # Also keeps container doctrees (Py 3.12) separate from host ``poe docs``.
      - docs_build:/app/docs-build
      - ./src:/app/src:ro
      - ./data:/app/data:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./README.md:/app/README.md:ro
      - ./LICENSE:/app/LICENSE:ro

volumes:
  docs_build:
